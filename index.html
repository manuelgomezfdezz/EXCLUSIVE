document.addEventListener('DOMContentLoaded', async function() {

  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    }

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"apple-mobile-web-app-title\" content=\"PULSO\">\n<meta name=\"theme-color\" content=\"#F2F2F7\">\n<title>PULSO<\u002Ftitle>\n\n<script src=\"2f8efb99-e1cc-4676-bf13-3cc340e3d141\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet><style>@media (max-width:520px){html,body{background:#F2F2F7}#pw{padding:0!important;display:block!important;min-height:0!important}#pf{zoom:1!important;width:100vw!important;height:100dvh!important;padding:0!important;border-radius:0!important;box-shadow:none!important;background:transparent!important}#ps{width:100%!important;height:100%!important;border-radius:0!important}#pn,#ph{display:none!important}#pb{height:max(env(safe-area-inset-top),14px)!important;padding:0!important}#pb span{display:none}}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#dcdce1;font-family:-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"Helvetica Neue\",system-ui,sans-serif}button{font-family:inherit;border:0;background:none;padding:0;color:inherit;cursor:pointer;text-align:left}input{font-family:inherit;color:inherit;outline:none}.sb::-webkit-scrollbar{display:none}.sb{scrollbar-width:none}a{color:#007AFF}a:hover{color:#0A60C8}<\u002Fstyle><\u002Fhelmet>\n<div id=\"pw\" style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px\">\n<div id=\"pf\" style=\"zoom:{{ scale }};width:410px;height:864px;flex:none;background:#0b0b0d;border-radius:62px;padding:10px;box-shadow:0 30px 70px rgba(0,0,0,.28)\">\n<div id=\"ps\" style=\"--bg:{{ c.bg }};--card:{{ c.card }};--ink:{{ c.ink }};--sub:{{ c.sub }};--line:{{ c.line }};--fill:{{ c.fill }};--acc:{{ c.acc }};--str:{{ c.str }};--run:{{ c.run }};--nut:{{ c.nut }};--hlt:{{ c.hlt }};--glass:{{ c.glass }};position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;font-size:17px\">\n<div id=\"pn\" style=\"position:absolute;top:11px;left:50%;margin-left:-60px;width:120px;height:34px;border-radius:20px;background:#000;z-index:60\"><\u002Fdiv>\n<div id=\"pb\" style=\"height:54px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 34px 8px 38px;font-size:16px;font-weight:600;position:relative;z-index:5\"><span>9:41<\u002Fspan><span style=\"font-size:13px;letter-spacing:1px\">●●● ▮<\u002Fspan><\u002Fdiv>\n\n<div class=\"sb\" style=\"flex:1;overflow:auto;padding-bottom:120px\">\n\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"padding:8px 20px 0;display:flex;flex-direction:column;gap:16px\">\n<div style=\"flex:none;display:flex;align-items:flex-start;justify-content:space-between\">\n<div><div style=\"font-size:13px;font-weight:600;color:var(--sub);text-transform:capitalize\">{{ dateLabel }}<\u002Fdiv><div style=\"font-size:36px;font-weight:700;letter-spacing:-.035em;line-height:1.15;margin-top:2px;white-space:nowrap\">{{ greeting }}<\u002Fdiv><\u002Fdiv>\n<button sc-camel-on-click=\"{{ openProfile }}\" aria-label=\"Perfil\" style=\"width:40px;height:40px;border-radius:20px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-weight:600;margin-top:4px\">P<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{ hasDraftHidden }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ resumeActive }}\" style=\"background:var(--str);color:#fff;border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;font-weight:600\"><span>Entrenamiento en curso<\u002Fspan><span>{{ draftTime }} ›<\u002Fspan><\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ hasDemo }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--sub);background:var(--fill);border-radius:12px;padding:10px 14px\"><span>Datos de demostración, no son tuyos<\u002Fspan><button sc-camel-on-click=\"{{ removeDemo }}\" style=\"color:var(--acc);font-weight:600\">Quitar<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n<div sc-camel-on-click=\"{{ openBalance }}\" style=\"background:#0b0b0d;color:#fff;border-radius:30px;padding:26px 22px 22px;cursor:pointer\">\n<div style=\"font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.62)\">Balance energético · hoy<\u002Fdiv>\n<sc-if value=\"{{ eOk }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:68px;font-weight:700;letter-spacing:-.045em;line-height:1;margin-top:12px;color:{{ balColor }}\">{{ balText }}<\u002Fdiv>\n<div style=\"font-size:21px;font-weight:600;letter-spacing:-.01em;margin-top:6px\">{{ balLabel }} <span style=\"color:rgba(255,255,255,.62);font-weight:500\">kcal<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14)\"><sc-for list=\"{{ eStats }}\" as=\"e\" hint-placeholder-count=\"3\"><div><div style=\"font-size:12px;color:rgba(255,255,255,.62)\">{{ e.n }}<\u002Fdiv><div style=\"font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px\">{{ e.v }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<div style=\"font-size:12px;color:rgba(255,255,255,.62);margin-top:14px;line-height:1.45\">{{ goalLine }} Estimación con tu perfil (TMB × 1,2, prorrateada hasta ahora) y valores MET de cada actividad. Toca para ver el cálculo. Con Apple Salud conectado se usaría la energía medida por el reloj.<\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ eNone }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:12px\">Déficit o superávit, calculado.<\u002Fdiv><div style=\"font-size:15px;color:rgba(255,255,255,.7);margin-top:8px;line-height:1.45\">Con tu edad, altura y peso, la app estima tu gasto y lo compara con lo que registras comer.<\u002Fdiv><button sc-camel-on-click=\"{{ openProfile }}\" style=\"margin-top:18px;background:#fff;color:#000;border-radius:16px;height:48px;width:100%;text-align:center;line-height:48px;font-weight:700\">Completar perfil<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n<sc-if value=\"{{ allEmpty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"background:var(--card);border-radius:18px;padding:20px\"><div style=\"font-size:20px;font-weight:700\">Empieza por un registro<\u002Fdiv><div style=\"color:var(--sub);margin-top:6px;font-size:15px;line-height:1.4\">Registra una serie, una carrera o una comida y aquí verás el resumen del día. También puedes cargar datos de demostración desde Ajustes.<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<div style=\"background:var(--card);border-radius:18px;padding:18px\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:13px;font-weight:600;color:var(--sub)\">Calorías de hoy<\u002Fspan><button sc-camel-on-click=\"{{ goFood }}\" style=\"font-size:13px;color:var(--acc)\">Comidas ›<\u002Fbutton><\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:6px;margin-top:4px\"><span style=\"font-size:44px;font-weight:700;letter-spacing:-.03em\">{{ kcalToday }}<\u002Fspan><span style=\"color:var(--sub);font-size:15px\">{{ kcalGoalText }}<\u002Fspan><\u002Fdiv>\n<div style=\"height:6px;border-radius:3px;background:var(--fill);margin-top:8px;overflow:hidden\"><div style=\"height:100%;width:{{ kcalPct }}%;background:var(--nut);border-radius:3px\"><\u002Fdiv><\u002Fdiv>\n<div style=\"font-size:13px;color:var(--sub);margin-top:6px;padding-right:64px\">{{ kcalRemain }}<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px\">\n<sc-for list=\"{{ macros }}\" as=\"m\" hint-placeholder-count=\"3\"><div><div style=\"display:flex;justify-content:space-between;font-size:13px\"><span style=\"color:var(--sub)\">{{ m.name }}<\u002Fspan><\u002Fdiv><div style=\"font-size:20px;font-weight:600;margin-top:2px\">{{ m.val }}<span style=\"font-size:13px;color:var(--sub);font-weight:400\"> {{ m.goal }}<\u002Fspan><\u002Fdiv><div style=\"height:4px;border-radius:2px;background:var(--fill);margin-top:6px;overflow:hidden\"><div style=\"height:100%;width:{{ m.pct }}%;background:{{ m.color }}\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n<sc-for list=\"{{ tiles }}\" as=\"t\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ t.go }}\" style=\"background:var(--card);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:13px;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:6px\"><span style=\"width:8px;height:8px;border-radius:4px;background:{{ t.color }}\"><\u002Fspan>{{ t.label }}<\u002Fspan><span style=\"font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px\">{{ t.value }}<\u002Fspan><span style=\"font-size:13px;color:var(--sub)\">{{ t.sub }}<\u002Fspan><\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ openHealth }}\" style=\"background:var(--card);border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center\"><span><span style=\"font-size:13px;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:6px\"><span style=\"width:8px;height:8px;border-radius:4px;background:var(--hlt)\"><\u002Fspan>Actividad de Apple Salud<\u002Fspan><span style=\"font-size:15px;margin-top:4px;display:block\">Pasos y energía activa no disponibles<\u002Fspan><\u002Fspan><span style=\"color:var(--sub)\">›<\u002Fspan><\u002Fbutton>\n<div><div style=\"font-size:13px idth:0;width:100%\"><input value=\"{{ f.sumHr }}\" sc-camel-on-change=\"{{ h.sumHr }}\" inputmode=\"decimal\" placeholder=\"FC (opc.)\" style=\"height:48px;border-radius:14px;border:0;background:var(--card);padding:0 14px;font-size:17px;min-width:0;width:100%\"><\u002Fdiv><div style=\"font-size:12px;color:var(--sub);line-height:1.4\">Indica cuánto has entrenado. Con Apple Watch, duración, kcal y pulsaciones se importarán de Apple Salud (app nativa).<\u002Fdiv>\n<input value=\"{{ f.notes }}\" sc-camel-on-change=\"{{ h.notes }}\" placeholder=\"Notas de la sesión (opcional)\" style=\"height:46px;border-radius:12px;border:0;background:var(--card);padding:0 14px;font-size:17px\">\n<button sc-camel-on-click=\"{{ saveRoutine }}\" style=\"background:var(--card);border-radius:16px;height:50px;text-align:center;font-weight:600;color:var(--acc)\">{{ sm.routineLabel }}<\u002Fbutton>\n<button sc-camel-on-click=\"{{ closeSheet }}\" style=\"background:var(--str);color:#fff;border-radius:16px;height:52px;text-align:center;font-weight:700\">Hecho<\u002Fbutton><\u002Fsc-if>\n\n<sc-if value=\"{{ s_settings }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:var(--card);border-radius:18px;padding:4px 16px\"><sc-for list=\"{{ settingsRows }}\" as=\"r\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ r.go }}\" style=\"width:100%;display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)\"><span style=\"font-weight:600\">{{ r.label }}<\u002Fspan><span style=\"color:var(--sub);font-size:15px\">{{ r.val }} ›<\u002Fspan><\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<div style=\"background:var(--card);border-radius:18px;padding:14px 16px\"><div style=\"font-weight:600\">Tema<\u002Fdiv><div style=\"display:flex;background:var(--fill);border-radius:10px;padding:2px;margin-top:8px\"><sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ t.go }}\" style=\"flex:1;text-align:center;padding:8px 0;border-radius:8px;font-size:14px;font-weight:600;background:{{ t.bg }}\">{{ t.name }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--card);border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center\"><span><span style=\"font-weight:600;display:block\">Descanso entre series<\u002Fspan><span style=\"font-size:13px;color:var(--sub)\">{{ rest }} s<\u002Fspan><\u002Fspan><span style=\"display:flex;gap:8px\"><button sc-camel-on-click=\"{{ restLess }}\" style=\"width:44px;height:36px;background:var(--fill);border-radius:10px;text-align:center;line-height:36px;font-size:20px\">−<\u002Fbutton><button sc-camel-on-click=\"{{ restMore }}\" style=\"width:44px;height:36px;background:var(--fill);border-radius:10px;text-align:center;line-height:36px;font-size:20px\">+<\u002Fbutton><\u002Fspan><\u002Fdiv>\n<div style=\"background:var(--card);border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center\"><span><span style=\"font-weight:600;display:block\">Datos de demostración<\u002Fspan><span style=\"font-size:13px;color:var(--sub)\">Se pueden quitar sin afectar a tus registros<\u002Fspan><\u002Fspan><button sc-camel-on-click=\"{{ toggleDemo }}\" aria-label=\"Datos de demostración\" style=\"width:51px;height:31px;border-radius:16px;background:{{ demoBg }};position:relative\"><span style=\"position:absolute;top:2px;left:{{ demoLeft }}px;width:27px;height:27px;border-radius:14px;background:#fff;transition:left .15s\"><\u002Fspan><\u002Fbutton><\u002Fdiv>\n<div style=\"font-size:13px;color:var(--sub);text-align:center\">PULSO 0.1 · prototipo web · unidades: kg, km, ml<\u002Fdiv><\u002Fsc-if>\n\n<sc-if value=\"{{ s_goals }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-size:13px;color:var(--sub)\">Deja un campo vacío para no tener objetivo. Son referencias personales, no recomendaciones médicas.<\u002Fdiv>\n<div style=\"background:var(--card);border-radius:18px;padding:4px 16px\"><sc-for list=\"{{ goalFields }}\" as=\"g\" hint-placeholder-count=\"6\"><div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)\"><span style=\"font-weight:600\">{{ g.label }}<\u002Fspan><span style=\"display:flex;align-items:center;gap:6px\"><input value=\"{{ g.val }}\" sc-camel-on-change=\"{{ g.on }}\" inputmode=\"numeric\" placeholder=\"–\" style=\"width:90px;height:38px;border-radius:10px;border:0;background:var(--fill);text-align:right;padding:0 12px;font-size:17px\"><span style=\"width:44px;color:var(--sub);font-size:14px\">{{ g.unit }}<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<sc-if value=\"{{ goalErr }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color:var(--hlt);font-size:14px\">{{ goalErr }}<\u002Fdiv><\u002Fsc-if>\n<button sc-camel-on-click=\"{{ saveGoals }}\" style=\"background:var(--acc);color:#fff;border-radius:16px;height:52px;text-align:center;font-weight:700\">Guardar objetivos<\u002Fbutton><\u002Fsc-if>\n\n<sc-if value=\"{{ s_health }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:var(--card);border-radius:18px;padding:16px\"><div style=\"font-weight:700\">No conectado<\u002Fdiv><div style=\"font-size:14px;color:var(--sub);margin-top:4px;line-height:1.4\">Este prototipo web no puede acceder a HealthKit. Los permisos de abajo son una simulación para validar el diseño. Última sincronización: nunca.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--card);border-radius:18px;padding:4px 16px\"><sc-for list=\"{{ healthRows }}\" as=\"r\" hint-placeholder-count=\"6\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)\"><span style=\"min-width:0\"><span style=\"display:block;font-weight:600\">{{ r.name }}<\u002Fspan><span style=\"display:block;font-size:13px;color:var(--sub);margin-top:2px;line-height:1.3\">{{ r.why }}<\u002Fspan><\u002Fspan>< :2px;line-height:1.4\">{{ c.d }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<button sc-camel-on-click=\"{{ exportData }}\" style=\"background:var(--card);border-radius:16px;height:50px;text-align:center;font-weight:600;color:var(--acc)\">Exportar mis datos (JSON)<\u002Fbutton>\n<button sc-camel-on-click=\"{{ askDeleteAll }}\" style=\"background:var(--card);border-radius:16px;height:50px;text-align:center;font-weight:600;color:var(--hlt)\">Eliminar todos los datos<\u002Fbutton><\u002Fsc-if>\n\n<sc-if value=\"{{ s_profile }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-size:14px;color:var(--sub);line-height:1.45\">Solo se usa para estimar tu gasto energético (Mifflin-St Jeor, o Katch-McArdle si indicas el % de grasa). Se guarda en este navegador.<\u002Fdiv>\n<div style=\"display:flex;background:var(--fill);border-radius:10px;padding:2px\"><sc-for list=\"{{ pf.sexes }}\" as=\"b\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ b.go }}\" style=\"flex:1;text-align:center;padding:8px 0;border-radius:8px;font-size:14px;font-weight:600;background:{{ b.bg }}\">{{ b.name }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px\"><input value=\"{{ f.pAge }}\" sc-camel-on-change=\"{{ h.pAge }}\" inputmode=\"decimal\" placeholder=\"Edad\" style=\"height:48px;border-radius:14px;border:0;background:var(--card);padding:0 14px;font-size:17px;min-width:0;width:100%\"><input value=\"{{ f.pH }}\" sc-camel-on-change=\"{{ h.pH }}\" inputmode=\"decimal\" placeholder=\"Altura cm\" style=\"height:48px;border-radius:14px;border:0;background:var(--card);padding:0 14px;font-size:17px;min-width:0;width:100%\"><input value=\"{{ f.pW }}\" sc-camel-on-change=\"{{ h.pW }}\" inputmode=\"decimal\" placeholder=\"Peso kg\" style=\"height:48px;border-radius:14px;border:0;background:var(--card);padding:0 14px;font-size:17px;min-width:0;width:100%\"><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr;gap:10px\"><input value=\"{{ f.pBf }}\" sc-camel-on-change=\"{{ h.pBf }}\" inputmode=\"decimal\" placeholder=\"% de grasa corporal (opc.)\" style=\"height:48px;border-radius:14px;border:0;background:var(--card);padding:0 14px;font-size:17px;min-width:0;width:100%\"><\u002Fdiv><div style=\"font-size:13px;color:var(--sub)\">Objetivo temporal<\u002Fdiv>\n<div style=\"display:flex;background:var(--fill);border-radius:10px;padding:2px\"><sc-for list=\"{{ pf.goals }}\" as=\"b\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ b.go }}\" style=\"flex:1;text-align:center;padding:8px 0;border-radius:8px;font-size:14px;font-weight:600;background:{{ b.bg }}\">{{ b.name }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<sc-if value=\"{{ pf.showAmt }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\"><input value=\"{{ f.pAmt }}\" sc-camel-on-change=\"{{ h.pAmt }}\" inputmode=\"decimal\" placeholder=\"kcal/día (def. 400)\" style=\"height:48px;border-radius:14px;border:0;background:var(--card);padding:0 14px;font-size:17px;min-width:0;width:100%\"><input value=\"{{ f.pWk }}\" sc-camel-on-change=\"{{ h.pWk }}\" inputmode=\"decimal\" placeholder=\"Duración en semanas\" style=\"height:48px;border-radius:14px;border:0;background:var(--card);padding:0 14px;font-size:17px;min-width:0;width:100%\"><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ pf.err }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color:var(--hlt);font-size:14px\">{{ pf.err }}<\u002Fdiv><\u002Fsc-if>\n<button sc-camel-on-click=\"{{ saveProfile }}\" style=\"background:var(--acc);color:#fff;border-radius:16px;height:52px;text-align:center;font-weight:700\">Guardar perfil<\u002Fbutton>\n<button sc-camel-on-click=\"{{ openSettings }}\" style=\"background:var(--card);border-radius:16px;height:50px;text-align:center;font-weight:600\">Ajustes de la app ›<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ s_act }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"sb\" style=\"display:flex;gap:8px;overflow:auto\"><sc-for list=\"{{ actTypes }}\" as=\"t\" hint-placeholder-count=\"8\"><button sc-camel-on-click=\"{{ t.go }}\" style=\"flex:none;border-radius:16px;padding:7px 12px;font-size:14px;font-weight:600;background:{{ t.bg }};color:{{ t.fg }}\">{{ t.name }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<div style=\"display:flex;background:var(--fill);border-radius:10px;padding:2px\"><sc-for list=\"{{ runDays }}\" as=\"b\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ b.go }}\" style=\"flex:1;text-align:center;padding:8px 0;border-radius:8px;font-size:14px;font-weight:600;background:{{ b.bg }}\">{{ b.name }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\"><input value=\"{{ f.aMin }}\" sc-camel-on-change=\"{{ h.aMin }}\" inputmode=\"decimal\" placeholder=\"Duración (min)\" style=\"height:48px;border-radius:14px;border:0;background:var(--card);padding:0 14px;font-size:17px;min-width:0;width:100%\"><input value=\"{{ f.aKm }}\" sc-camel-on-change=\"{{ h.aKm }}\" inputmode=\"decimal\" placeholder=\"Distancia km (opc.)\" style=\"height:48px;border-radius:14px;border:0;background:var(--card);padding:0 14px;font-size:17px;min-width:0;width:100%\"><input value=\"{{ f.aKcal }}\" sc-camel-on-change=\"{{ h.aKcal }}\" inputmode=\"decimal\" placeholder=\"kcal activas (opc.)\" style=\"height:48px;border-radius:14px;border:0;background:var(--card);padding:0 14px;font-size:17px;min-width:0;width:100%\"><input value=\"{{ f.aHr }}\" sc-camel-on-change=\"{{ h.aHr }}\" inputmode=\"decimal\" placeholder=\"FC media (opc.)\" style=\"height:48px;border-radius:14px;border:0;background:var(--card);padding:0 14px;font-size:17px;min-width:0;width:100%\"><\u002Fdiv>\n<div style=\"background:var(--card);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between\"><span style=\"color:var(--sub)\">Gasto de la actividad<\u002Fspan><span style=\"font-weight:700\">{{ af.est }}<\u002Fspan><\u002Fdiv>\n<sc-if value=\"{{ af.err }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color:var(--hlt);font-size:14px\">{{ af.err }}<\u002Fdiv><\u002Fsc-if>\n<button sc-camel-on-click=\"{{ saveAct }}\" style=\"background:var(--acc);color:#fff;border-radius:16px;height:52px;text-align:center;font-weight:700\">Guardar actividad<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ s_actDetail }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:var(--card);border-radius:18px;padding:18px\"><div style=\"font-size:13px;color:var(--sub)\">{{ ad.when }}<\u002Fdiv><div style=\"font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:2px\">{{ ad.type }}<\u002Fdiv><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px\"><sc-for list=\"{{ ad.stats }}\" as=\"s\" hint-placeholder-count=\"4\"><div><div style=\"font-size:12px;color:var(--sub)\">{{ s.n }}<\u002Fdiv><div style=\"font-size:18px;font-weight:600\">{{ s.v }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n<button sc-camel-on-click=\"{{ askDelAct }}\" style=\"color:var(--hlt);font-weight:600\">Eliminar actividad<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ s_balance }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#0b0b0d;color:#fff;border-radius:24px;padding:22px;text-align:center\"><div style=\"font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1;color:{{ balColor }}\">{{ bl.big }}<\u002Fdiv><div style=\"font-size:15px;color:rgba(255,255,255,.7);margin-top:6px\">{{ bl.label }}<\u002Fdiv><\u002Fdiv>\n<div style=\"background:var(--card);border-radius:18px;padding:4px 16px\"><sc-for list=\"{{ bl.rows }}\" as=\"r\" hint-placeholder-count=\"8\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)\"><span style=\"min-width:0\"><span style=\"display:block;font-weight:{{ r.w }};font-size:15px\">{{ r.n }}<\u002Fspan><span style=\"display:block;font-size:12px;color:var(--sub);margin-top:1px\">{{ r.sub }}<\u002Fspan><\u002Fspan><span style=\"font-weight:{{ r.w }};white-space:nowrap\">{{ r.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<div style=\"font-size:14px;line-height:1.45\">{{ bl.target }}<\u002Fdiv>\n<div style=\"font-size:12px;color:var(--sub);line-height:1.5\">Balance = ingeridas − (TMB × 1,2 + actividad). Valores estimados: la TMB y los MET pueden desviarse un 10–20 %. Fuerza usa 5 MET, correr 1 kcal por kg y km, el resto su MET; si indicas kcal, se usan esas.<\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ s_routine }}\" hint-placeholder-val=\"{{ false }}\">\n<input value=\"{{ f.rName }}\" sc-camel-on-change=\"{{ h.rName }}\" placeholder=\"Nombre (p. ej. Empuje)\" style=\"height:48px;border-radius:14px;border:0;background:var(--card);padding:0 16px;font-size:17px\">\n<div style=\"font-size:13px;color:var(--sub)\">Días de la semana<\u002Fdiv>\n<div style=\"display:flex;gap:6px\"><sc-for list=\"{{ rt.dayChips }}\" as=\"k\" hint-placeholder-count=\"7\"><button sc-camel-on-click=\"{{ k.go }}\" style=\"flex:1;height:40px;border-radius:20px;text-align:center;line-height:40px;font-weight:700;background:{{ k.bg }};color:{{ k.fg }}\">{{ k.l }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<div style=\"background:var(--card);border-radius:18px;padding:2px 16px\"><sc-if value=\"{{ rt.noEx }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:14px 0;color:var(--sub);font-size:15px\">Sin ejercicios<\u002Fdiv><\u002Fsc-if><sc-for list=\"{{ rt.exs }}\" as=\"e\" hint-placeholder-count=\"3\"><div style=\"display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)\"><span style=\"font-weight:600\">{{ e.name }}<\u002Fspan><button sc-camel-on-click=\"{{ e.del }}\" style=\"color:var(--hlt);font-size:14px;font-weight:600\">Quitar<\u002Fbutton><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<button sc-camel-on-click=\"{{ addToRoutine }}\" style=\"background:var(--card);border-radius:16px;height:50px;text-align:center;font-weight:600;color:var(--acc)\">+ Añadir ejercicio<\u002Fbutton>\n<div style=\"font-size:12px;color:var(--sub);line-height:1.4\">La duración, kcal y pulsaciones de cada día los indicas al terminar la sesión, o se importarán de Apple Salud con la app nativa.<\u002Fdiv>\n<sc-if value=\"{{ rt.err }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color:var(--hlt);font-size:14px\">{{ rt.err }}<\u002Fdiv><\u002Fsc-if>\n<button sc-camel-on-click=\"{{ saveRoutineEd }}\" style=\"background:var(--str);color:#fff;border-radius:16px;height:52px;text-align:center;font-weight:700\">Guardar rutina<\u002Fbutton>\n<sc-if value=\"{{ rt.editing }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ delRoutine }}\" style=\"color:var(--hlt);font-weight:600\">Eliminar rutina<\u002Fbutton><\u002Fsc-if><\u002Fsc-if>\n<sc-if value=\"{{ s_confirm }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-size:15px;color:var(--sub);line-height:1.4\">{{ cm.msg }}<\u002Fdiv>\n<button sc-camel-on-click=\"{{ cm.ok }}\" style=\"background:{{ cm.color }};color:#fff;border-radius:16px;height:52px;text-align:center;font-weight:700\">{{ cm.label }}<\u002Fbutton>\n<button sc-camel-on-click=\"{{ cm.cancel }}\" style=\"background:var(--card);border-radius:16px;height:50px;text-align:center;font-weight:600\">Cancelar<\u002Fbutton><\u002Fsc-if>\n\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ obOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:absolute;inset:0;background:var(--bg);z-index:55;display:flex;flex-direction:column;padding:70px 24px 40px\">\n<div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"font-weight:700;letter-spacing:.14em;font-size:13px\">PULSO<\u002Fspan><button sc-camel-on-click=\"{{ obSkip }}\" style=\"color:var(--acc);font-size:16px\">Omitir<\u002Fbutton><\u002Fdiv>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:14px;padding-top:30px;overflow:auto\" class=\"sb\">\n<sc-if value=\"{{ ob0 }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:36px;font-weight:700;letter-spacing:-.025em;line-height:1.1\">Fuerza, carrera y comida en un solo lugar.<\u002Fdiv><div style=\"color:var(--sub);line-height:1.45\">¿Qué quieres registrar? Puedes cambiarlo cuando quieras.<\u002Fdiv>\n<sc-for list=\"{{ obActs }}\" as=\"a\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ a.go }}\" style=\"background:var(--card);border-radius:18px;padding:18px;display:flex;justify-content:space-between;align-items:center;border:2px solid {{ a.bd }}\"><span style=\"font-weight:600;font-size:18px\">{{ a.name }}<\u002Fspan><span style=\"color:{{ a.color }};font-weight:700\">{{ a.mark }}<\u002Fspan><\u002Fbutton><\u002Fsc-for><\u002Fsc-if>\n<sc-if value=\"{{ ob1 }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1\">Objetivos diarios<\u002Fdiv><div style=\"color:var(--sub);line-height:1.45\">Opcionales. Si los dejas vacíos, la app no te propondrá ninguno. Son referencias personales, no recomendaciones médicas.<\u002Fdiv>\n<div style=\"background:var(--card);border-radius:18px;padding:4px 16px\"><sc-for list=\"{{ obGoals }}\" as=\"g\" hint-placeholder-count=\"4\"><div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)\"><span style=\"font-weight:600\">{{ g.label }}<\u002Fspan><span style=\"display:flex;align-items:center;gap:6px\"><input value=\"{{ g.val }}\" sc-camel-on-change=\"{{ g.on }}\" inputmode=\"numeric\" placeholder=\"–\" style=\"width:90px;height:38px;border-radius:10px;border:0;background:var(--fill);text-align:right;padding:0 12px;font-size:17px\"><span style=\"width:34px;color:var(--sub);font-size:14px\">{{ g.unit }}<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ ob2 }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1\">Apple Salud<\u002Fdiv><div style=\"color:var(--sub);line-height:1.45\">En la app nativa podrás importar entrenamientos, peso y actividad para no escribirlos dos veces. Se pedirá cada permiso por separado y solo los que elijas.<\u002Fdiv><div style=\"background:var(--card);border-radius:18px;padding:16px;font-size:14px;line-height:1.45;color:var(--sub)\">En este prototipo web no hay conexión real. Puedes ver la pantalla de permisos simulada más tarde en Ajustes. La app funciona igual sin Apple Salud.<\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ ob3 }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1\">¿Cómo quieres empezar?<\u002Fdiv><div style=\"color:var(--sub);line-height:1.45\">Los datos de demostración aparecen marcados y se quitan con un toque.<\u002Fdiv>\n<button sc-camel-on-click=\"{{ obStartEmpty }}\" style=\"background:var(--ink);color:var(--bg);border-radius:16px;height:54px;text-align:center;font-weight:700;margin-top:6px\">Empezar vacío<\u002Fbutton>\n<button sc-camel-on-click=\"{{ obStartDemo }}\" style=\"background:var(--card);border-radius:16px;height:54px;text-align:center;font-weight:600;color:var(--acc)\">Cargar datos de demostración<\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n<sc-if value=\"{{ obNext }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ obForward }}\" style=\"background:var(--acc);color:#fff;border-radius:16px;height:54px;text-align:center;font-weight:700\">Continuar<\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"position:absolute;left:20px;right:20px;top:60px;background:var(--ink);color:var(--bg);border-radius:16px;padding:13px 16px;font-size:15px;font-weight:600;z-index:80;line-height:1.3\">{{ toast }}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst FOODS=[\n{id:'avena',n:'Copos de avena',b:'g',k:370,p:13,c:60,f:7},\n{id:'leche',n:'Leche semidesnatada',b:'ml',k:46,p:3.4,c:4.8,f:1.6},\n{id:'yogur',n:'Yogur natural',b:'g',k:61,p:3.5,c:4.7,f:3.3,u:125},\n{id:'platano',n:'Plátano',b:'g',k:89,p:1.1,c:23,f:.3,u:120},\n{id:'manzana',n:'Manzana',b:'g',k:52,p:.3,c:14,f:.2,u:180},\n{id:'huevo',n:'Huevo',b:'g',k:143,p:12.6,c:.7,f:9.5,u:60},\n{id:'arroz_c',n:'Arroz blanco',st:'crudo',v:'arroz_k',b:'g',k:360,p:7,c:79,f:.6},\n{id:'arroz_k',n:'Arroz blanco',st:'cocinado',v:'arroz_c',b:'g',k:130,p:2.7,c:28,f:.3},\n{id:'pollo_c',n:'Pechuga de pollo',st:'crudo',v:'pollo_k',b:'g',k:120,p:22.5,c:0,f:2.6},\n{id:'pollo_k',n:'Pechuga de pollo',st:'cocinado',v:'pollo_c',b:'g',k:165,p:31,c:0,f:3.6},\n{id:'pasta_c',n:'Pasta',st:'crudo',v:'pasta_k',b:'g',k:350,p:12,c:72,f:1.5},\n{id:'pasta_k',n:'Pasta',st:'cocinado',v:'pasta_c',b:'g',k:158,p:5.8,c:31,f:.9},\n{id:'atun',n:'Atún al natural',b:'g',k:116,p:26,c:0,f:1},\n{id:'pan',n:'Pan integral',b:'g',k:250,p:9,c:41,f:3.5},\n{id:'aceite',n:'Aceite de oliva',b:'ml',k:884,p:0,c:0,f:100},\n{id:'almendras',n:'Almendras',b:'g',k:579,p:21,c:22,f:50}];\nconst EX=[\n{id:'banca',n:'Press banca',m:'Pecho',s:'Tríceps, hombro',t:'Compuesto',e:'Barra'},\n{id:'inclinado',n:'Press inclinado',m:'Pecho',s:'Hombro',t:'Compuesto',e:'Mancuernas'},\n{id:'militar',n:'Press militar',m:'Hombros',s:'Tríceps',t:'Compuesto',e:'Barra'},\n{id:'lateral',n:'Elevaciones laterales',m:'Hombros',s:'',t:'Aislamiento',e:'Mancuernas'},\n{id:'triceps',n:'Extensión de tríceps',m:'Tríceps',s:'',t:'Aislamiento',e:'Polea'},\n{id:'fondos',n:'Fondos',m:'Pecho',s:'Tríceps',t:'Compuesto',e:'Peso corporal',bw:1},\n{id:'dominadas',n:'Dominadas',m:'Espalda',s:'Bíceps',t:'Compuesto',e:'Peso corporal',bw:1},\n{id:'remo',n:'Remo con barra',m:'Espalda',s:'Bíceps',t:'Compuesto',e:'Barra'},\n{id:'jalon',n:'Jalón al pecho',m:'Espalda',s:'Bíceps',t:'Compuesto',e:'Polea'},\n{id:'curl',n:'Curl de bíceps',m:'Bíceps',s:'',t:'Aislamiento',e:'Mancuernas'},\n{id:'sentadilla',n:'Sentadilla',m:'Piernas',s:'Glúteos',t:'Compuesto',e:'Barra'},\n{id:'prensa',n:'Prensa de piernas',m:'Piernas',s:'Glúteos',t:'Compuesto',e:'Máquina'},\n{id:'muerto',n:'Peso muerto',m:'Espalda baja',s:'Isquios, glúteos',t:'Compuesto',e:'Barra'},\n{id:'hip',n:'Hip thrust',m:'Glúteos',s:'Isquios',t:'Compuesto',e:'Barra'}];\nconst CATS=['Desayuno','Media mañana','Comida','Merienda','Cena','Snack'];\nconst RTYPES=['Rodaje suave','Carrera larga','Series','Intervalos','Tempo','Recuperación','Competición','Otra'];\nconst IC={home:'M3 11l9-8 9 8v10h-6v-6H9v6H3z',train:'M2 10v4M5 7v10M19 7v10M22 10v4M5 12h14',run:'M12 21a8 8 0 100-16 8 8 0 000 16zM12 9v4l3 2M9 2h6',food:'M7 3v8M5 3v5a2 2 0 004 0V3M7 11v10M17 3c-2 2-2 6 0 8v10',prog:'M3 20h18M6 16v-5M11 16V7M16 16v-8',weight:'M5 4h14l2 16H3zM12 9v4M9 9a3 3 0 016 0',water:'M12 3c4 5 6 8 6 11a6 6 0 01-12 0c0-3 2-6 6-11z'};\nconst PK=['onboarded','theme','goals','goalsDemo','profile','profileDemo','rest','demoOn','data','health','draft'];\nconst D=864e5;const MET={Caminar:3.5,Ciclismo:7.5,Natación:6,HIIT:8,Yoga:2.5,Remo:7,Senderismo:6,Otro:4};const ATY=[['Caminar','M12 4a1.5 1.5 0 100 .01M10 21l1-6-3-3 2-5 3 2 3 1M9 12l-3 2'],['Ciclismo','M5 18a3 3 0 100 .01M19 18a3 3 0 100 .01M5 18l4-8h6l4 8M9 10l3 8M14 6h3'],['Natación','M2 18c2 0 2-1.5 5-1.5s3 1.5 5 1.5 3-1.5 5-1.5 3 1.5 5 1.5M8 12l4-4 3 3'],['HIIT','M13 2L4 14h7l-1 8 9-12h-7z'],['Yoga','M12 5a2 2 0 100 .01M5 12h14M12 8v6l-4 6M12 14l4 6'],['Remo','M3 17h18M7 17l5-8 5 8'],['Senderismo','M3 20l6-10 4 6 3-4 5 8z'],['Otro','M12 3v18M3 12h18']];\nconst uid=()=>Math.random().toString(36).slice(2,10);\nconst N=(x,d=1)=>Number(x).toLocaleString('es-ES',{maximumFractionDigits:d});\nconst num=v=>{const x=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(x)?x:NaN};\nconst sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};\nconst mmss=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(r).padStart(2,'0')};\nconst fexp=(id)=>FOODS.find(f=>f.id===id);\nconst mk=(f,amount,unit,ts,cat,demo)=>{const g=unit==='ud'?amount*f.u:amount;const r=g/100;return{id:uid(),ts,cat,foodId:f.id,name:f.n,amount,unit,grams:g,per:{k:f.k,p:f.p,c:f.c,f:f.f},base:f.b,u:f.u||0,st:f.st||null,kcal:f.k*r,p:f.p*r,c:f.c*r,f:f.f*r,status:'estimado',source:'Catálogo local de ejemplo',demo:!!demo}};\nclass Component extends DCLogic{\nstate=this.init();\ninit(){let p=null;try{p=JSON.parse(localStorage.getItem('pulso.v1'))}catch(e){}\nconst dd={workouts:[],runs:[],meals:[],water:[],weights:[],customFoods:[],customEx:[],routines:[],saved:[],favs:[],acts:[]};\nconst base={onboarded:false,theme:'auto',goals:null,goalsDemo:false,profile:null,profileDemo:false,rest:90,demoOn:false,data:dd,health:{weight:'none',workouts:'none',steps:'none',hr:'none',energy:'none',sleep:'none'},draft:null};\nconst ps=p?{...base,...p,data:{...dd,...(p.data||{})},health:{...base.health,...(p.health||{})}}:base;\nreturn{...ps,tab:'home',sheet:null,f:{},toast:null,now:Date.now(),foodOff:0,per:30,ob:0,obAct:{s:true,r:true},cat:'Desayuno',fe:null,confirm:null,restEnd:null,restTotal:0,pickMode:'add',sync:false,active:!!ps.draft,sel:null,pSex:'f',pGoal:'mantener',actType:'Caminar',calOff:0,rt:null,off:{items:[],loading:false,err:''},scale:1,runDay:0,runType:'Rodaje suave',runEff:0,cfBase:'g',cfStat:'estimado',wDay:0,summary:null}}\ncomponentDidMount(){this.fit=()=>this.setState({scale:Math.min(1,(window.innerHeight-24)/864)});this.fit();window.addEventListener('resize',this.fit);this.iv=setInterval(()=>{const s=this.state;let up={now:Date.now()};if(s.restEnd&&Date.now()>=s.restEnd){up.restEnd=null;up.toast='Descanso terminado';setTimeout(()=>this.setState({toast:null}),2200)}this.setState(up)},1000);if(this.state.draft)this.msg('Entrenamiento recuperado')}\ncomponentWillUnmount(){clearInterval(this.iv);window.removeEventListener('resize',this.fit)}\npersist(){try{const o={};PK.forEach(k=>o[k]=this.state[k]);localStorage.setItem('pulso.v1',JSON.stringify(o))}catch(e){this.msg('Error de almacenamiento: no se pudieron guardar los cambios')}}\nupd(fn,cb){this.setState(fn,()=>{this.persist();cb&&cb()})}\nupdData(k,fn){this.upd(s=>({data:{...s.data,[k]:fn(s.data[k])}}))}\nmsg(t){this.setState({toast:t});clearTimeout(this.tt);this.tt=setTimeout(()=>this.setState({toast:null}),2600)}\nopen(sheet,x){this.setState({sheet,...(x||{})})}\nclose(){this.setState({sheet:null,confirm:null,fe:null,sync:false})}\nsetF(k,v){this.setState(s=>({f:{...s.f,[k]:v}}))}\nask(title,msgT,label,color,ok){this.setState({sheet:'confirm',confirm:{title,msg:msgT,label,color,ok}})}\ngetEx(id){return EX.find(e=>e.id===id)||this.state.data.customEx.find(e=>e.id===id)}\nallEx(){return [...EX,...this.state.data.customEx]}\nvol(w){let v=0;w.exercises.forEach(x=>x.sets.forEach(s=>{if(s.done!==false&&s.type!=='warm'&&s.kg>0&&s.reps>0)v+=s.kg*s.reps}));return v}\nbestKg(id,before){let b=0;this.state.data.workouts.forEach(w=>{if(before&&w.ts>=before)return;w.exercises.forEach(x=>{if(x.exId===id)x.sets.forEach(s=>{if(s.type!=='warm'&&s.reps>0&&s.kg>b)b=s.kg})})});return b}\nlastOf(id,before){return this.state.data.workouts.filter(w=>(!before||w.ts<before)&&w.exercises.some(x=>x.exId===id)).sort((a,b)=>b.ts-a.ts)[0]}\nsetTxt(s){return(s.kg>0?N(s.kg,2)+' kg × ':'PC × ')+s.reps}\nexLast(id,before){const w=this.lastOf(id,before);if(!w)return null;return w.exercises.find(x=>x.exId===id).sets.filter(s=>s.type!=='warm')}\ndayEntries(off){const a=sod(Date.now())+off*D;return this.state.data.meals.filter(m=>m.ts>=a&&m.ts<a+D)}\ntot(es){const t={k:0,p:0,c:0,f:0};es.forEach(e=>{t.k+=e.kcal;t.p+=e.p;t.c+=e.c;t.f+=e.f});return t}\nhasDemo(){const d=this.state.data;return Object.keys(d).some(k=>d[k].some&&d[k].some(x=>x&&x.demo))}\nbuildDemo(){const now=Date.now(),t=(d,h)=>sod(now)-d*D+h*36e5;\nconst S=(kg,reps,type='work')=>({kg,reps,type,done:true});\nconst W=(d,h,name,min,exs)=>({id:uid(),ts:t(d,h),name,dur:min*60,notes:'',demo:true,exercises:exs.map(([exId,sets])=>({exId,sets}))});\nconst workouts=[\nW(1,18,'Empuje',62,[['banca',[S(60,10,'warm'),S(80,8),S(80,8),S(80,7)]],['militar',[S(40,8),S(40,8),S(40,7)]],['triceps',[S(25,12),S(25,12),S(27.5,10)]]]),\nW(3,18,'Tirón',58,[['dominadas',[S(0,8),S(0,7),S(0,6)]],['remo',[S(70,8),S(70,8),S(72.5,8)]],['curl',[S(14,10),S(14,10),S(14,9)]]]),\nW(6,19,'Piernas',70,[['sentadilla',[S(60,8,'warm'),S(100,6),S(100,6),S(100,6),S(100,5)]],['muerto',[S(120,5),S(120,5),S(120,5)]]]),\nW(8,18,'Empuje',60,[['banca',[S(77.5,8),S(77.5,8),S(77.5,8)]],['militar',[S(37.5,8),S(37.5,8),S(37.5,8)]],['triceps',[S(25,12),S(25,11),S(25,10)]]]),\nW(11,18,'Tirón',55,[['dominadas',[S(0,7),S(0,6),S(0,6)]],['remo',[S(67.5,8),S(67.5,8),S(67.5,8)]]])];\nconst R=(d,h,type,km,min,sec,hr)=>({id:uid(),ts:t(d,h),type,km,dur:min*60+sec,hr:hr||null,hrMax:null,elev:null,note:'',src:'manual',demo:true});\nconst runs=[R(2,7,'Rodaje suave',8.2,46,10,142),R(4,7,'Tempo',6,29,30,168),R(7,8,'Carrera larga',14.5,79,40,149),R(9,7,'Rodaje suave',7,40,5,141),R(12,7,'Intervalos',5.5,28,10,165),R(16,7,'Rodaje suave',8,46,40,143),R(20,8,'Carrera larga',12,68,30,148)];\nconst meals=[];for(let i=0;i<7;i++){const x=t(i,8);meals.push(mk(fexp('avena'),60,'g',x,'Desayuno',1),mk(fexp('leche'),250,'ml',x,'Desayuno',1),mk(fexp('platano'),1,'ud',x,'Desayuno',1));const y=t(i,14);meals.push(mk(fexp('arroz_k'),190+i*10,'g',y,'Comida',1),mk(fexp('pollo_k'),180,'g',y,'Comida',1),mk(fexp('aceite'),10,'ml',y,'Comida',1));if(i>0){const z=t(i,21);meals.push(mk(fexp('atun'),120,'g',z,'Cena',1),mk(fexp('pan'),80,'g',z,'Cena',1))}}\nconst water=[{id:uid(),ts:t(0,9),ml:500,demo:true},{id:uid(),ts:t(0,12),ml:300,demo:true}];\nconst wk=[82.4,82.1,82.3,81.8,82.0,81.6,81.7,81.4,81.5,81.2,81.0,81.1,80.9];const weights=wk.map((kg,i)=>({id:uid(),ts:t(36-i*3,8),kg,note:'',src:'manual',demo:true}));\nconst routines=[{id:uid(),name:'Empuje',
